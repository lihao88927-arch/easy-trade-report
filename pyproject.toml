[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-trade-report"
version = "0.1.0"
description = "Markdown market reports for electrical equipment using the official UN Comtrade Python package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Easy Trade Report contributors" }]
keywords = ["UN Comtrade", "trade data", "HS code", "market research", "Markdown"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "comtradeapicall==1.3.2",
  "pandas>=2.2.1,<3",
  "pandera[pandas]>=0.32.1,<0.33",
  "requests>=2.31,<3",
  "tenacity>=9.1.4,<10",
  "urllib3>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pip>=26.1.2",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
  "zizmor==1.27.0",
]
excel = ["openpyxl>=3.1,<4"]

[project.scripts]
easy-trade-report = "easy_trade_report.cli:main"

[project.urls]
"UN Comtrade client" = "https://github.com/uncomtrade/comtradeapicall"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
